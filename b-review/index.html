<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>講座ごとの確認問題 | ドイツIOBオーガニックスクール</title>
<meta name="theme-color" content="#1583c4">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231583c4'/%3E%3Cpath d='M90 44 C58 66 58 110 90 140 C122 110 122 66 90 44 Z' fill='white'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231583c4'/%3E%3Cpath d='M90 44 C58 66 58 110 90 140 C122 110 122 66 90 44 Z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1583c4; --blue-dark:#0f6ba3; --blue-pale:#e7f1f8;
  --beige:#f7f4ec; --cream:#fbf9f3;
  --text-dark:#3d2a1e; --text-mid:#6b5544; --text-light:#8a7565; --white:#fff;
  --red:#c0392b; --red-pale:#fdf2f2; --orange:#cf5f2b; --orange-warm:#e8743c; --orange-pale:#fff4ec;
  --green-light:#9ac4e0; --tan:#b89a6f; --tan-line:#e3d8c4;
  --shadow:0 4px 20px rgba(61,42,30,.08); --shadow-lg:0 12px 40px rgba(61,42,30,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans JP',sans-serif;background:var(--beige);color:var(--text-dark);min-height:100vh;line-height:1.85;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.serif{font-family:'Noto Serif JP',serif}
a{color:inherit}
header{background:var(--blue);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 20px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(15,107,163,.25)}
header .inner{max-width:720px;margin:0 auto}
header .label{font-size:11px;font-weight:500;letter-spacing:.14em;opacity:.92}
header h1{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:700;margin-top:4px;line-height:1.4}
.progress-wrap{max-width:720px;margin:0 auto;padding:14px 20px 0}
.progress-bar{height:7px;background:#fff;border:1px solid var(--tan-line);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-dark));width:0;transition:width .4s;border-radius:99px}
.progress-text{display:flex;justify-content:space-between;font-size:12px;color:var(--text-light);margin-top:7px;font-weight:600}
main{max-width:720px;margin:0 auto;padding:20px 18px 60px}
.card{background:var(--white);border:1px solid var(--tan-line);border-radius:16px;padding:26px 22px;box-shadow:var(--shadow)}

/* ===== ハブ（講座選択） ===== */
.intro h2{font-family:'Noto Serif JP',serif;font-size:21px;color:var(--blue-dark);margin-bottom:14px;line-height:1.6}
.intro p{font-size:15px;color:var(--text-mid);margin-bottom:14px}
.intro p b{color:var(--text-dark)}
.today-hint{background:linear-gradient(180deg,#fff,#fff9f5);border:2px solid var(--orange-warm);border-radius:12px;padding:12px 15px;font-size:13.5px;color:var(--text-dark);font-weight:600;margin-bottom:16px;box-shadow:0 8px 24px rgba(232,116,60,.12)}
.btn-all{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border:none;border-radius:12px;background:var(--orange-warm);color:#fff;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 6px 18px rgba(232,116,60,.28);transition:.15s;margin-bottom:20px}
.btn-all:hover{background:var(--orange);transform:translateY(-2px)}
.hub-list{display:flex;flex-direction:column;gap:18px}
.chap-group{display:flex;flex-direction:column;gap:8px}
.chap-h{font-size:12px;font-weight:700;color:var(--blue-dark);letter-spacing:.04em;display:flex;align-items:center;gap:7px}
.chap-h:before{content:"";width:14px;height:2px;background:var(--orange-warm);border-radius:2px}
.course-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-family:inherit;background:var(--cream);border:1.5px solid var(--tan-line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:.15s;color:inherit}
.course-row:hover{border-color:var(--blue);background:#fff;transform:translateY(-2px);box-shadow:var(--shadow)}
.course-row .cn{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--blue-dark);background:var(--blue-pale);border-radius:8px;padding:4px 9px;white-space:nowrap}
.course-row .ct{flex:1;min-width:0;font-size:14.5px;font-weight:600;color:var(--text-dark);line-height:1.5}
.course-row .cc{flex:0 0 auto;font-size:12px;color:var(--text-light);font-weight:600;white-space:nowrap}
.course-row .rec-badge{flex:0 0 auto;font-size:11px;font-weight:700;color:#fff;background:var(--orange-warm);border-radius:999px;padding:3px 9px;white-space:nowrap}
.course-row.rec{border-color:var(--orange-warm);background:#fffaf5}
.intro .note{background:var(--blue-pale);border:1px solid #cfe3f1;padding:14px 16px;border-radius:10px;font-size:14px;color:var(--text-mid);margin-top:20px;line-height:1.85}

/* ===== クイズ ===== */
.quiz-top{max-width:720px;margin:0 auto;padding:16px 18px 0}
.to-hub{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--blue-dark);background:#fff;border:1.5px solid var(--tan-line);border-radius:999px;padding:8px 15px;text-decoration:none;cursor:pointer;font-family:inherit;transition:.15s}
.to-hub:hover{border-color:var(--blue);background:var(--blue-pale)}
.course-tag{display:inline-block;background:var(--blue-pale);color:var(--blue-dark);font-size:12px;font-weight:700;padding:5px 14px;border-radius:999px;margin-bottom:14px}
.q-num{font-size:12px;color:var(--orange);font-weight:700;letter-spacing:.06em;margin-bottom:6px}
.q-text{font-size:17px;font-weight:500;line-height:1.8;margin-bottom:10px;color:var(--text-dark)}
.q-hint{font-size:12.5px;color:var(--orange);background:var(--orange-pale);border:1px solid #f3d9c6;padding:8px 13px;border-radius:9px;margin-bottom:18px;display:inline-block;font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:14px 15px;border:2px solid var(--tan-line);border-radius:11px;cursor:pointer;transition:.15s;background:var(--cream);font-size:15px;text-align:left;line-height:1.7;width:100%;font-family:inherit;color:inherit}
.opt:hover:not(.locked){border-color:var(--blue);background:var(--blue-pale)}
.opt.sel{border-color:var(--blue);background:var(--blue-pale)}
.opt .box{flex:0 0 20px;height:20px;border:2px solid var(--green-light);border-radius:6px;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff}
.opt.sel .box{background:var(--blue);border-color:var(--blue)}
.opt.correct{border-color:var(--blue);background:var(--blue-pale)}
.opt.wrong{border-color:var(--red);background:var(--red-pale)}
.opt.locked{cursor:default}
.opt .mark{margin-left:auto;font-weight:700;font-size:15px;flex:none}
.opt.correct .mark{color:var(--blue-dark)}
.opt.wrong .mark{color:var(--red)}
.nav{display:flex;gap:10px;margin-top:20px}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s;text-align:center;text-decoration:none}
.btn:hover{background:var(--blue-dark)}
.btn:disabled{background:#cdbfa8;cursor:not-allowed}
.btn.sub{background:#fff;color:var(--blue-dark);border:1.5px solid var(--blue)}
.btn.sub:hover{background:var(--blue-pale)}
.result{margin-top:20px;padding:18px;border-radius:12px;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.result.ok{background:var(--blue-pale);border-left:4px solid var(--blue)}
.result.ng{background:var(--red-pale);border-left:4px solid var(--red)}
.result .verdict{font-weight:700;font-size:16px;margin-bottom:8px}
.result.ok .verdict{color:var(--blue-dark)}
.result.ng .verdict{color:var(--red)}
.result .exp{font-size:14.5px;color:var(--text-mid);line-height:1.9}
.note{background:var(--blue-pale);border:1px solid #cfe3f1;padding:14px 16px;border-radius:10px;font-size:14px;color:var(--text-mid);line-height:1.85}
.score-hero{text-align:center;padding:14px 0 22px}
.score-num{font-family:'Noto Serif JP',serif;font-size:52px;color:var(--blue-dark);line-height:1.1;font-weight:700}
.score-num small{font-size:22px;color:var(--text-light)}
.score-msg{font-size:15px;color:var(--text-mid);margin-top:10px}
.review-title{font-weight:700;color:var(--blue-dark);margin:24px 0 10px;font-size:16px}
.review-item{background:var(--cream);border:1px solid var(--tan-line);border-radius:10px;padding:12px 14px;margin-bottom:9px;font-size:14.5px}
.review-item b{color:var(--blue-dark)}
.review-item .qq{color:var(--text-mid);font-size:13.5px;margin-top:4px;display:block}
.perfect{background:var(--blue-pale);border:1px solid #cfe3f1;padding:16px;border-radius:10px;font-size:15px;color:var(--blue-dark);text-align:center;line-height:1.85}
footer{text-align:center;font-size:11.5px;color:var(--text-light);padding:30px 18px calc(30px + env(safe-area-inset-bottom));border-top:1px solid var(--tan-line);line-height:1.9}
.foot-logo{height:28px;width:auto;display:block;margin:0 auto 12px;opacity:.95}
@media(max-width:520px){.card{padding:20px 16px}.q-text{font-size:16px}.opt{font-size:14.5px}.course-row{flex-wrap:wrap}.course-row .ct{flex-basis:100%;order:3}}
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="label">ドイツIOBオーガニックスクール</div>
    <h1 class="serif" id="ttl">講座ごとの確認問題</h1>
  </div>
</header>
<div class="progress-wrap" id="pw" style="display:none">
  <div class="progress-bar"><div class="progress-fill" id="pf"></div></div>
  <div class="progress-text"><span id="pt"></span><span id="ps">正解 0</span></div>
</div>
<main id="app"></main>
<footer>
  <img class="foot-logo" src="../assets/iob-logo-orange.png" alt="Institut für Organic Business">
  ドイツIOBオーガニックスクール<br>Copyright ©2026 Institut für Organic Business GmbH.
</footer>

<script>
const app=document.getElementById('app'),pw=document.getElementById('pw'),pf=document.getElementById('pf'),pt=document.getElementById('pt'),ps=document.getElementById('ps'),ttl=document.getElementById('ttl');
const OUT_OF_SCOPE=[4,12,21];
const CHAPTERS=[{t:'第1章',c:[1,2,3,5]},{t:'第2章',c:[6,7,8,9,10,11]},{t:'第3章',c:[13,14,15,16,17,18,19,20]}];
// メールレッスンの「振り返り日」プリセット（?d=1〜5 の互換用）
const DAYS={1:{label:'振り返り 1日目（10/5）',c:[1,6]},2:{label:'振り返り 2日目（10/6）',c:[2,7,8]},3:{label:'振り返り 3日目（10/7）',c:[3,5,9]},4:{label:'振り返り 4日目（10/8）',c:[10,11]},5:{label:'振り返り 5日目（10/9）',c:[13,14,15,16,17,18,19,20]}};
let ALL=[],QS=[],idx=0,picks=[],submitted=[],curLabel='';
let TITLES={},COUNTS={};

fetch('questions.json').then(r=>r.json()).then(d=>{
  ALL=d.filter(q=>!OUT_OF_SCOPE.includes(q.course));
  ALL.forEach(q=>{TITLES[q.course]=q.courseTitle;COUNTS[q.course]=(COUNTS[q.course]||0)+1;});
  route();
}).catch(()=>{app.innerHTML='<div class="card"><p>問題の読み込みに失敗しました。ページを再読み込みしてください。</p></div>';});

function route(){
  const p=new URLSearchParams(location.search);
  const c=p.get('c'),dd=p.get('d');
  if(c&&COUNTS[+c]) return startSet([+c],`講座${+c}　${TITLES[+c]||''}`);
  if(dd&&DAYS[dd]) return startSet(DAYS[dd].c,DAYS[dd].label);
  renderHub();
}
function todaysCourses(){
  const now=new Date(Date.now()+9*3600*1000),y=now.getUTCFullYear(),m=now.getUTCMonth()+1,d=now.getUTCDate();
  if(y!==2026||m!==10) return [];
  const R={5:[1,6],6:[2,7,8],7:[3,5,9],8:[10,11],9:[13,14,15,16,17,18,19,20]};
  return R[d]||[];
}
function renderHub(){
  pw.style.display='none';ttl.textContent='講座ごとの確認問題';
  const todays=todaysCourses();
  const chapHtml=CHAPTERS.map(ch=>{
    const rows=ch.c.filter(c=>COUNTS[c]).map(c=>{
      const rec=todays.includes(c);
      return `<button class="course-row${rec?' rec':''}" onclick="startSet([${c}],'講座${c}　${esc(TITLES[c]||'')}')">
        <span class="cn">講座${c}</span>
        <span class="ct">${esc(TITLES[c]||'')}</span>
        ${rec?'<span class="rec-badge">👆 今日</span>':''}
        <span class="cc">${COUNTS[c]}問</span>
      </button>`;
    }).join('');
    return `<div class="chap-group"><div class="chap-h">${ch.t}</div>${rows}</div>`;
  }).join('');
  const total=ALL.length;
  const recNote=todays.length
    ?`<div class="today-hint">👆 今日のおすすめ：${todays.map(c=>'講座'+c).join('・')}<br><span style="font-weight:400;color:var(--text-mid);font-size:12.5px">ほかの講座も、いつでも・何度でも受けられます。</span></div>`
    :'';
  app.innerHTML=`<div class="card intro">
    <h2>講座ごとの確認問題</h2>
    <p>出題範囲の18講座から、受けたい講座を選んで確かめられます。<b>いつでも、何度でも、どの講座からでも</b>取り組めます。</p>
    ${recNote}
    <button class="btn-all" onclick="startSet('ALL','出題範囲すべて（18講座）')">出題範囲すべて（18講座・${total}問）をまとめて受ける</button>
    <div class="hub-list">${chapHtml}</div>
    <div class="note">点数を競うものではありません。当てはまるものを<b>すべて選ぶ</b>形式で、1問ごとに正誤と解説が出ます。間違えたところが、そのまま「見直す場所」になります。</div>
  </div>`;
  window.scrollTo(0,0);
}
function startSet(courses,label){
  const pool=courses==='ALL'?ALL.slice():ALL.filter(q=>courses.includes(q.course));
  QS=pool.slice().sort((a,b)=>a.course-b.course).map(shuf);
  curLabel=label;idx=0;picks=QS.map(()=>[]);submitted=QS.map(()=>false);
  ttl.textContent='確認問題';pw.style.display='block';renderQ();
}
function scoreSoFar(){let s=0;QS.forEach((q,i)=>{if(submitted[i]&&isCorrect(i))s++;});return s;}
function isCorrect(i){const q=QS[i];return q.correct.slice().sort().join(',')===picks[i].slice().sort().join(',');}
function hubLink(){return `<div class="quiz-top" style="padding-left:0;padding-right:0;padding-top:0"><button class="to-hub" onclick="renderHub()">← 講座一覧にもどる</button></div>`;}
function renderQ(){
  const q=QS[idx];const done=submitted[idx];
  pf.style.width=(((done?idx+1:idx))/QS.length*100)+'%';
  pt.textContent=`${idx+1} / ${QS.length}`;ps.textContent=`正解 ${scoreSoFar()}`;
  const opts=q.options.map((o,i)=>{
    const picked=picks[idx].includes(i),isC=q.correct.includes(i);
    let cls='opt',mark='';
    if(done){cls+=' locked';if(isC){cls+=' correct';mark='<span class="mark">正</span>';}else if(picked){cls+=' wrong';mark='<span class="mark">誤</span>';}}
    else if(picked){cls+=' sel';}
    return `<button class="${cls}" data-i="${i}" ${done?'':`onclick="toggle(${i})"`}><span class="box">${picked?'✓':''}</span><span>${esc(o)}</span>${mark}</button>`;
  }).join('');
  let res='';
  if(done){const ok=isCorrect(idx);res=`<div class="result ${ok?'ok':'ng'}"><div class="verdict">${ok?'正解です':'惜しい、不正解です'}</div><div class="exp">${esc(q.exp)}</div></div>`;}
  const backBtn=idx>0?`<button class="btn sub" onclick="go(-1)">前の問題へ</button>`:'';
  let mainBtn;
  if(!done){mainBtn=`<button class="btn" id="submit" ${picks[idx].length?'':'disabled'} onclick="submit()">回答する</button>`;}
  else{mainBtn=`<button class="btn" onclick="go(1)">${idx===QS.length-1?'結果を見る':'次の問題へ'}</button>`;}
  app.innerHTML=`<div class="card">
    <button class="to-hub" style="margin-bottom:14px" onclick="renderHub()">← 講座一覧</button>
    <span class="course-tag">${esc(curLabel)}</span>
    <div class="q-num">第${idx+1}問</div>
    <div class="q-text">${esc(q.q)}</div>
    ${done?'':'<div class="q-hint">当てはまるものを、すべて選んでください</div>'}
    <div class="opts">${opts}</div>
    <div id="res">${res}</div>
    <div class="nav">${backBtn}${mainBtn}</div>
  </div>`;
  window.scrollTo(0,0);
}
function toggle(i){
  if(submitted[idx])return;
  const p=picks[idx],k=p.indexOf(i);
  if(k>=0)p.splice(k,1);else p.push(i);
  const el=document.querySelector(`.opt[data-i="${i}"]`);
  el.classList.toggle('sel');el.querySelector('.box').textContent=el.classList.contains('sel')?'✓':'';
  const b=document.getElementById('submit');if(b)b.disabled=p.length===0;
}
function submit(){if(!submitted[idx]){submitted[idx]=true;}renderQ();}
function go(d){const ni=idx+d;if(ni<0)return;if(ni>=QS.length)return renderResult();idx=ni;renderQ();}
function renderResult(){
  pf.style.width='100%';pt.textContent=`${QS.length} / ${QS.length}`;ps.textContent=`正解 ${scoreSoFar()}`;
  const score=scoreSoFar();
  const wrongs=QS.filter((q,i)=>submitted[i]&&!isCorrect(i));
  const nC=new Set(wrongs.map(q=>q.course)).size;
  const msg=(nC?`見直しておきたい講座が${nC}講座ありました。`:'')+'この結果は、認定試験の合否を予測するものではありません。';
  const byCourse={};
  wrongs.forEach(q=>{(byCourse[q.course]=byCourse[q.course]||{t:q.courseTitle,qs:[]}).qs.push(q.q);});
  const keys=Object.keys(byCourse).map(Number).sort((a,b)=>a-b);
  app.innerHTML=`<div class="card">
    <div class="score-hero">
      <div style="font-size:13px;color:var(--text-light)">${esc(curLabel)}</div><div class="score-num">${score}<small> / ${QS.length}問</small></div>
      <div class="score-msg">${msg}</div>
    </div>
    ${keys.length?`<div class="review-title">見直したい講座（${keys.length}講座）</div>
      ${keys.map(c=>`<div class="review-item"><b>講座${c}　${esc(byCourse[c].t)}</b>
        ${byCourse[c].qs.map(t=>`<span class="qq">・${esc(t)}</span>`).join('')}</div>`).join('')}
      <div class="note" style="margin-top:14px">全部を復習し直す必要はありません。間違えたところだけ、資料や動画で確認すれば十分です。</div>`
      :`<div class="perfect">全問確認できました。今回の範囲で、見直しが必要な講座はありません。<br>ほかの講座でも、覚えているか確かめてみてください。</div>`}
    <div class="nav" style="margin-top:20px">
      <button class="btn sub" onclick="startSet(${JSON.stringify(QS.map(q=>q.course).filter((v,i,a)=>a.indexOf(v)===i))},'${esc(curLabel)}')">もう一度挑戦する</button>
      <button class="btn" onclick="renderHub()">ほかの講座を受ける</button>
    </div>
    <p style="text-align:center;margin-top:16px;font-size:14px"><a href="../b-map/" style="color:var(--blue-dark);font-weight:600">🗺 試験準備の地図にもどる</a></p>
  </div>`;
  window.scrollTo(0,0);
}
function shuf(q){const o=q.options.map((t,i)=>({t,c:q.correct.includes(i)}));for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];}return Object.assign({},q,{options:o.map(x=>x.t),correct:o.map((x,i)=>x.c?i:-1).filter(i=>i>=0)});}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
