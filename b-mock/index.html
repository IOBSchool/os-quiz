<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>本番形式・実力確認テスト | ドイツIOBオーガニックスクール</title>
<meta name="theme-color" content="#1583c4">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231583c4'/%3E%3Cpath d='M90 44 C58 66 58 110 90 140 C122 110 122 66 90 44 Z' fill='white'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231583c4'/%3E%3Cpath d='M90 44 C58 66 58 110 90 140 C122 110 122 66 90 44 Z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* IOB 動画視聴ページ配色（既存変数名にマッピング） */
  --blue:#1583c4; --blue-dark:#0f6ba3; --blue-pale:#e7f1f8;
  --green-dark:#0f6ba3; --green-mid:#1583c4; --green-light:#9ac4e0; --green-pale:#e7f1f8;
  --beige:#f7f4ec; --cream:#fbf9f3; --gold:#e8743c;
  --text-dark:#3d2a1e; --text-mid:#6b5544; --text-light:#8a7565; --white:#fff;
  --red:#c0392b; --red-pale:#fdf2f2; --orange:#cf5f2b; --orange-pale:#fff4ec;
  --tan:#b89a6f; --tan-line:#e3d8c4;
  --shadow:0 4px 20px rgba(61,42,30,.08); --shadow-lg:0 12px 40px rgba(61,42,30,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans JP',sans-serif;background:var(--beige);color:var(--text-dark);min-height:100vh;line-height:1.85;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.serif{font-family:'Noto Serif JP',serif}
a{color:inherit}
header{background:var(--blue);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 20px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(15,107,163,.25)}
header .inner{max-width:720px;margin:0 auto}
header .label{font-size:11px;font-weight:500;letter-spacing:.14em;opacity:.92}
header h1{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:700;margin-top:4px;line-height:1.4}
.progress-wrap{max-width:720px;margin:0 auto;padding:14px 20px 0}
.progress-bar{height:7px;background:#fff;border:1px solid var(--tan-line);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-dark));width:0;transition:width .4s;border-radius:99px}
.progress-text{display:flex;justify-content:space-between;font-size:12px;color:var(--text-light);margin-top:7px;font-weight:600}
main{max-width:720px;margin:0 auto;padding:20px 18px 60px}
.card{background:var(--white);border:1px solid var(--tan-line);border-radius:16px;padding:26px 22px;box-shadow:var(--shadow);margin-bottom:16px}
.course-tag{display:inline-block;background:var(--blue-pale);color:var(--blue-dark);font-size:12px;font-weight:700;padding:5px 14px;border-radius:999px;margin-bottom:14px}
.q-num{font-size:12px;color:var(--text-light);margin-bottom:6px}
.q-text{font-size:17px;font-weight:500;line-height:1.8;margin-bottom:8px;color:var(--text-dark)}
.q-hint{font-size:12.5px;color:var(--orange);background:var(--orange-pale);border:1px solid #f3d9c6;padding:8px 13px;border-radius:9px;margin-bottom:18px;display:inline-block;font-weight:600}
.q-hint.neg{color:var(--red);background:var(--red-pale);border-color:#f3c6c6}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:14px 15px;border:2px solid var(--tan-line);border-radius:11px;cursor:pointer;transition:.15s;background:var(--cream);font-size:15px;text-align:left;line-height:1.7;font-family:inherit;color:inherit;width:100%}
.opt:hover{border-color:var(--blue);background:var(--blue-pale)}
.opt.sel{border-color:var(--blue);background:var(--blue-pale)}
.opt .lb{flex:0 0 auto;font-weight:700;color:var(--blue)}
.opt .box{flex:0 0 20px;height:20px;border:2px solid var(--green-light);border-radius:6px;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff}
.opt.sel .box{background:var(--blue);border-color:var(--blue)}
.nav{display:flex;gap:10px;margin-top:20px}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s;text-align:center;text-decoration:none}
.btn:hover{background:var(--blue-dark)}
.btn.sub{background:#fff;color:var(--blue-dark);border:1.5px solid var(--blue)}
.btn.sub:hover{background:var(--blue-pale)}
.intro h2{font-family:'Noto Serif JP',serif;font-size:21px;color:var(--blue-dark);margin-bottom:14px;line-height:1.6}
.intro p{font-size:15px;color:var(--text-mid);margin-bottom:14px}
.intro ul{margin:0 0 16px 20px;font-size:14.5px;color:var(--text-mid)}
.intro li{margin-bottom:7px}
.note{background:var(--blue-pale);border:1px solid #cfe3f1;padding:14px 16px;border-radius:10px;font-size:14px;color:var(--text-mid);margin-bottom:12px;line-height:1.85}
textarea{width:100%;min-height:200px;border:2px solid var(--tan-line);border-radius:11px;padding:12px;font-family:inherit;font-size:15px;line-height:1.8;background:var(--cream);color:var(--text-dark)}
textarea:focus{outline:none;border-color:var(--blue)}
.count{font-size:12px;color:var(--text-light);text-align:right;margin-top:4px}
.sec-title{font-family:'Noto Serif JP',serif;font-size:18px;color:var(--blue-dark);margin-bottom:6px}
.sec-lead{font-size:13.5px;color:var(--text-mid);margin-bottom:14px}
/* 見直すマップ（結果の主役）— 点数ではなく「どこに戻るか」を瞬時に */
.rc{padding:15px 16px;border:1px solid #eab38f;border-left:5px solid var(--orange);background:var(--orange-pale);border-radius:0 13px 13px 0;margin-bottom:12px}
.rc-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rc-c{font-family:'Noto Serif JP',serif;font-weight:700;font-size:18px;color:var(--text-dark)}
.rc-t{flex:1;min-width:0;font-size:13px;color:var(--text-mid)}
.rc-b{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--orange);background:#fff;border:1px solid #eab38f;border-radius:20px;padding:2px 10px}
.rc-l{font-size:12.5px;font-weight:700;color:var(--orange);margin:12px 0 8px;display:flex;align-items:center;gap:5px}
.rc-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:7px;background:#fff;border:1.5px solid #e79b6a;border-radius:10px;padding:8px 13px;font-size:13px;line-height:1.35;color:var(--text-dark);max-width:100%}
.chip b{color:var(--orange);font-weight:700;font-size:15px;white-space:nowrap;font-family:'Noto Serif JP',serif}
.rc-q{font-size:11.5px;color:var(--text-light);margin-top:10px}
.oktag{font-size:13px;color:var(--blue-dark);background:var(--blue-pale);border:1px solid #cfe3f1;border-radius:10px;padding:11px 13px;margin-top:8px;line-height:1.75}
.allok{font-size:14.5px;color:var(--blue-dark);background:var(--blue-pale);border:1px solid #cfe3f1;border-radius:11px;padding:16px;line-height:1.9}
.scoreline{text-align:center;font-size:14px;color:var(--text-mid);margin-bottom:4px}
.scoreline b{font-size:20px;color:var(--blue-dark);font-family:'Noto Serif JP',serif}
/* 各問レビュー */
.rv{border:1px solid var(--tan-line);border-radius:11px;margin-bottom:10px;background:var(--cream);overflow:hidden}
.rv.ng{border-color:#e0a99f;background:var(--red-pale)}
.rv.ng summary{border-left:5px solid var(--red)}
.rv.ok summary{border-left:5px solid var(--green-light)}
.rv .meta{font-size:13px;color:var(--text-mid);font-weight:600}
.rvst{font-size:11px;font-weight:700;padding:1px 8px;border-radius:7px;white-space:nowrap}
.rvst.ng{background:var(--red);color:#fff}
.rvst.ok{background:var(--blue-pale);color:var(--blue-dark)}
.rv summary{list-style:none;cursor:pointer;padding:13px 14px;font-size:14px;display:flex;gap:11px;align-items:flex-start}
.rv summary::-webkit-details-marker{display:none}
.rv .mk{flex:0 0 auto;font-weight:700;width:1.4em;text-align:center;font-size:18px}
.rv.ok .mk{color:var(--blue)} .rv.ng .mk{color:var(--red)}
.rv .stt{flex:1;min-width:0;line-height:1.55;color:var(--text-dark)}
.rv .stt small{color:var(--text-light);font-size:12px;font-weight:600}
.rv .tog{flex:0 0 auto;align-self:center;font-size:11.5px;font-weight:700;color:var(--blue-dark);background:var(--blue-pale);border:1px solid #cfe3f1;border-radius:8px;padding:4px 9px;white-space:nowrap}
.rv .tog::before{content:'＋ 開く'}
.rv[open] .tog::before{content:'− 閉じる'}
.rv[open] .tog{color:var(--text-light);background:var(--beige);border-color:var(--tan-line)}
.rv .body{padding:2px 14px 14px}
.rv .ansline{font-size:12.5px;color:var(--text-light);margin-bottom:10px;font-weight:600}
.ro{padding:10px 12px;border-radius:9px;margin-bottom:8px;background:#fff;border:1px solid var(--tan-line);font-size:14px;line-height:1.7}
.ro.ans{border-color:var(--blue);background:var(--blue-pale)}
.ro.mywrong{border-color:#e0a99f;background:var(--red-pale)}
.ro .h{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.ro .lb{font-weight:700;color:var(--text-mid)}
.ro .tf{font-size:12px;font-weight:700}
.ro .tf.t{color:var(--blue-dark)} .ro .tf.f{color:var(--red)}
.ro .tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:7px}
.ro .tag.ans{background:var(--blue);color:#fff}
.ro .tag.you{background:var(--red);color:#fff}
.ro .rt{color:var(--text-dark)}
.ro .why{font-size:12.5px;color:var(--text-mid);margin-top:6px;padding-top:6px;border-top:1px dashed var(--tan-line)}
.goto{font-size:13px;margin-top:9px;color:var(--orange)}
/* 講座カードに内包する「まちがえた問題の解説」（低彩度・すっきり） */
.rc-qs{margin-top:13px;border-top:1px dashed #e6c9ae;padding-top:12px}
.rc-ql{font-size:12px;font-weight:700;color:var(--text-mid);margin-bottom:9px}
.qd{background:#fff;border:1px solid var(--tan-line);border-radius:9px;margin-bottom:7px;overflow:hidden}
.qd summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;gap:9px;align-items:baseline;font-size:13.5px}
.qd summary::-webkit-details-marker{display:none}
.qd .qn{flex:0 0 auto;font-weight:700;color:var(--red)}
.qd .qs2{flex:1;min-width:0;color:var(--text-dark);line-height:1.55}
.qd .tog2{flex:0 0 auto;align-self:center;font-size:15px;font-weight:700;color:var(--blue-dark);line-height:1}
.qd .tog2::before{content:'＋'}
.qd[open] .tog2::before{content:'－'}
.qd[open] .tog2{color:var(--text-light)}
.qb{padding:0 13px 13px}
.kd{font-size:12.5px;color:var(--text-mid);margin:2px 0 10px;font-weight:600}
.ansk{font-weight:700;color:var(--text-dark);background:#fde6bd;padding:2px 9px;border-radius:6px}
.ro2{font-size:13.5px;line-height:1.75;color:var(--text-dark);padding:6px 0 6px 11px;border-left:3px solid #ece3d3;margin-bottom:5px}
.ro2.a{border-left-color:var(--blue)}
.ro2.w{border-left-color:var(--red)}
.ro2 .lb2{font-weight:700;color:var(--text-mid);margin-right:5px}
.t2{font-size:11px;font-weight:700;color:#fff;background:var(--blue);padding:1px 7px;border-radius:6px;margin-right:6px}
.w2{font-size:11px;font-weight:700;color:#fff;background:var(--red);padding:1px 7px;border-radius:6px;margin-right:6px}
.me2{font-size:11px;font-weight:700;color:var(--text-mid);border:1px solid var(--tan-line);padding:1px 7px;border-radius:6px;margin-right:6px}
.lg2{font-size:11.5px;color:var(--text-light);margin:0 0 11px;line-height:1.7}
.why2{font-size:12.5px;color:var(--text-mid);margin-top:4px}
.final{text-align:center;padding:10px 0 4px}
.final .n{font-family:'Noto Serif JP',serif;font-size:40px;color:var(--blue-dark);font-weight:700}
.final .n small{font-size:18px;color:var(--text-light)}
.pt li{margin:0 0 8px 20px;font-size:14px;color:var(--text-mid)}
.mine{white-space:pre-wrap;background:var(--cream);border:1px solid var(--tan-line);border-radius:9px;padding:12px;font-size:14px;margin-bottom:12px}
footer{text-align:center;font-size:11.5px;color:var(--text-light);padding:30px 18px calc(30px + env(safe-area-inset-bottom));border-top:1px solid var(--tan-line);line-height:1.9}
.foot-logo{height:28px;width:auto;display:block;margin:0 auto 12px;opacity:.95}
@media(max-width:520px){.card{padding:20px 16px}.q-text{font-size:16px}.opt{font-size:14.5px}.crow{flex-wrap:wrap}.dots{order:3;width:100%}}
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="label">ドイツIOBオーガニックスクール</div>
    <h1 class="serif">本番形式・実力確認テスト</h1>
  </div>
</header>
<div class="progress-wrap" id="pw" style="display:none">
  <div class="progress-bar"><div class="progress-fill" id="pf"></div></div>
  <div class="progress-text"><span id="pt"></span><span id="pa"></span></div>
</div>
<main id="app"></main>
<footer>
  <img class="foot-logo" src="../assets/iob-logo-orange.png" alt="Institut für Organic Business">
  ドイツIOBオーガニックスクール<br>Copyright ©2026 Institut für Organic Business GmbH.
</footer>

<script>
const NOTE='本試験の出題形式をもとに、講座で学んだ内容を、言い換えや日々の仕事の場面にあてはめて確かめられるよう作成した練習問題です。本試験とは別の問題で、正解数から本試験の合否を予測するものではありません。間違えた問題を、次に見直す場所を見つける手がかりとして使ってください。';
const L='abcdefgh';
const app=document.getElementById('app'),pw=document.getElementById('pw'),pf=document.getElementById('pf'),pt=document.getElementById('pt'),pa=document.getElementById('pa');
let DATA=null,QS=[],ESSAY=null,idx=0,picks=[],essayText='';

fetch('questions.json').then(r=>r.json()).then(d=>{DATA=d;ESSAY=d.essay;renderIntro();})
 .catch(()=>{app.innerHTML='<div class="card"><p>問題の読み込みに失敗しました。ページを再読み込みしてください。</p></div>';});

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffleQ(q){
  const ord=q.options.map((_,i)=>i);
  for(let i=ord.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ord[i],ord[j]]=[ord[j],ord[i]];}
  return {...q,options:ord.map(i=>q.options[i]),truth:ord.map(i=>q.truth[i]),notes:ord.map(i=>q.notes[i]),answer:ord.map((o,k)=>q.answer.includes(o)?k:-1).filter(k=>k>=0)};
}
function renderIntro(){
  pw.style.display='none';
  app.innerHTML=`<div class="card intro">
    <h2>本番形式・実力確認テスト<br>（選択35問＋記述1問）</h2>
    <p>講座1〜20のうち、出題範囲の18講座（講座4・12を除く）の内容を、本番と同じ出題形式で確かめられます。職種にかかわらず、講座で学んだ知識をさまざまな場面でどう活かせるかを確認する問題です。実際の認定試験と同様、お客様からの質問を想定した問題も含まれます。</p>
    <ul>
      <li>選択問題は、問題文に合わせて<b>「正しいものをすべて」</b>または<b>「誤っているものをすべて」</b>選びます。問題文をよく読んでから選んでください</li>
      <li>選択肢は1つとは限りません。1つでも過不足があると不正解になります</li>
      <li>途中では正解を表示しません。最後に、今回の回答から見える復習の目安、戻るとよい講座、各問の正誤と解説を確認できます</li>
      <li>35問＋記述1問あります。途中で画面を閉じると回答は残りませんので、時間のとれるときに取り組んでください</li>
      <li>何度でも取り組めます。選択肢の順番は毎回入れ替わります</li>
      <li>回答内容はどこにも送信・保存されません</li>
    </ul>
    <div class="note">${esc(NOTE)}</div>
    <button class="btn" onclick="start()">はじめる</button>
    <p style="text-align:center;margin-top:12px"><a href="#" onclick="demoResult();return false" style="font-size:13px;color:var(--text-light)">結果ページの見本を見る（仮の回答で表示）</a></p>
  </div>`;
}
function start(){
  QS=DATA.questions.map(shuffleQ);picks=QS.map(()=>[]);essayText='';idx=0;
  pw.style.display='block';renderQ();
}
function demoResult(){
  QS=DATA.questions.map(shuffleQ);
  picks=QS.map((q,i)=>{ if(i%3!==0)return q.answer.slice(); const w=q.options.map((_,k)=>k).find(k=>!q.answer.includes(k)); return w!=null?[w]:[]; });
  essayText='オーガニックは、自分の体によいだけでなく、作る人や環境、次の世代まで含めて考える仕組みです。（※これは結果ページ確認用の見本の本文です）';
  pw.style.display='block';renderResult();
}
function setProg(){
  const done=picks.filter(p=>p.length).length;
  pf.style.width=(idx/(QS.length+1)*100)+'%';
  pt.textContent=idx<QS.length?`${idx+1} / ${QS.length+1}`:`${QS.length+1} / ${QS.length+1}（記述）`;
  pa.textContent=`回答済み ${done} / ${QS.length}`;
}
function renderQ(){
  if(idx>=QS.length)return renderEssay();
  const q=QS[idx];setProg();
  const neg=q.kind==='F';
  app.innerHTML=`<div class="card">
    <span class="course-tag">問題${idx+1}</span>
    <div class="q-text">${esc(q.q)}</div>
    <div class="q-hint ${neg?'neg':''}">${neg?'「誤っているもの」をすべて選んでください':'「正しいもの」をすべて選んでください'}</div>
    <div class="opts">${q.options.map((o,i)=>
      `<button class="opt ${picks[idx].includes(i)?'sel':''}" data-i="${i}" onclick="toggle(${i})"><span class="box">${picks[idx].includes(i)?'✓':''}</span><span class="lb">${L[i]}.</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="nav">
      ${idx>0?'<button class="btn sub" onclick="go(-1)">前の問題へ</button>':''}
      <button class="btn" onclick="go(1)">${idx===QS.length-1?'記述問題へ':'次の問題へ'}</button>
    </div></div>`;
  window.scrollTo(0,0);
}
function toggle(i){
  const p=picks[idx];const k=p.indexOf(i);
  if(k>=0)p.splice(k,1);else p.push(i);
  const el=document.querySelector(`.opt[data-i="${i}"]`);
  el.classList.toggle('sel');el.querySelector('.box').textContent=el.classList.contains('sel')?'✓':'';
  setProg();
}
function go(d){idx+=d;renderQ();}
function renderEssay(){
  setProg();
  app.innerHTML=`<div class="card">
    <span class="course-tag">問題${QS.length+1}（記述）</span>
    <div class="q-text">${esc(ESSAY.q)}</div>
    <div class="q-hint">書き終えたら「結果を見る」へ。書いた文章を見直すための観点が表示されます</div>
    <textarea id="ta" placeholder="ここに書いてください" oninput="essayText=this.value;document.getElementById('cnt').textContent=this.value.length+'字'">${esc(essayText)}</textarea>
    <div class="count" id="cnt">${essayText.length}字</div>
    <div class="nav">
      <button class="btn sub" onclick="go(-1)">前の問題へ</button>
      <button class="btn" onclick="finish()">結果を見る</button>
    </div></div>`;
  window.scrollTo(0,0);
}
function finish(){
  const empty=picks.map((p,i)=>p.length?null:i+1).filter(x=>x);
  if(empty.length&&!confirm(`まだ選んでいない問題があります（問題${empty.join('・')}）。このまま結果を見ますか？`))return;
  renderResult();
}
function renderResult(){
  pf.style.width='100%';pt.textContent='結果';pa.textContent='';
  const res=QS.map((q,i)=>{const a=q.answer.slice().sort().join(','),m=picks[i].slice().sort().join(',');return a===m;});
  const correct=res.filter(x=>x).length;
  // 講座ごとに集計
  const byC={};
  QS.forEach((q,i)=>{const o=(byC[q.course]=byC[q.course]||{t:q.courseTitle,total:0,wrongIdx:[],backs:[]});o.total++;if(!res[i]){o.wrongIdx.push(i);o.backs.push(q.back);}});
  const cs=Object.keys(byC).map(Number).sort((a,b)=>a-b);
  const weakCs=cs.filter(c=>byC[c].wrongIdx.length),okCs=cs.filter(c=>!byC[c].wrongIdx.length);
  // 章コードをチップで視覚化し「この講座のこの部分」を瞬時に
  const chipsOf=backs=>{const seen=new Set(),out=[];backs.forEach(bs=>{const re=/「([^」]+)」/g;let m;while(m=re.exec(bs)){const c=m[1];if(seen.has(c))continue;seen.add(c);const mm=c.match(/^([0-9]+(?:-[0-9]+)*)\.?\s*(.*)$/);out.push(mm?{code:mm[1],title:mm[2]}:{code:'',title:c});}});return out;};
  // まちがえた1問の解説（低彩度・講座カードに内包）
  const qDetail=i=>{
    const q=QS[i];
    const rows=q.options.map((op,k)=>{
      const isAns=q.answer.includes(k),mine=picks[i].includes(k);
      const cls=isAns?'a':(mine?'w':'');
      let tag=isAns?'<span class="t2">✓ 正解</span>':'';
      if(mine)tag+=isAns?'<span class="me2">あなたの回答</span>':'<span class="w2">✕ あなたの回答（まちがい）</span>';
      return `<div class="ro2 ${cls}"><span class="lb2">${L[k]}.</span>${tag}${esc(op)}${(!q.truth[k]&&q.notes[k])?`<div class="why2">→ ${esc(q.notes[k])}</div>`:''}</div>`;}).join('');
    const short=esc(q.q.length>32?q.q.slice(0,32)+'…':q.q);
    return `<details class="qd"><summary><span class="qn">問題${i+1}</span><span class="qs2">${short}</span><span class="tog2"></span></summary>
      <div class="qb"><div class="kd">${q.kind==='F'?'誤っているものを選ぶ問題':'正しいものを選ぶ問題'}　／　<span class="ansk">正解：${q.answer.map(k=>L[k]).join('・')}</span></div><div class="lg2"><span class="t2">✓ 正解</span>＝選ぶべき選択肢　／　<span class="w2">✕ あなたの回答</span>＝あなたが選んで誤ったもの</div>${rows}</div></details>`;
  };
  // 見直すとよい講座（唯一の主役）。章チップ＋その講座でまちがえた問題の解説を内包
  let review;
  if(weakCs.length){
    review=weakCs.map(c=>{const o=byC[c];
      const chips=chipsOf(o.backs).map(ch=>`<span class="chip">${ch.code?`<b>${esc(ch.code)}</b>`:''}${ch.title?`<span>${esc(ch.title)}</span>`:''}</span>`).join('');
      const qs=o.wrongIdx.map(qDetail).join('');
      return `<div class="rc">
        <div class="rc-h"><span class="rc-c">講座${c}</span><span class="rc-t">${esc(o.t)}</span><span class="rc-b">まちがい${o.wrongIdx.length}問</span></div>
        <div class="rc-l">📺 この講座の、ここを見直す</div>
        <div class="rc-chips">${chips}</div>
        <div class="rc-qs"><div class="rc-ql">まちがえた問題（タップで解説）</div>${qs}</div>
      </div>`;}).join('');
  }else{
    review='<div class="allok">今回はすべて確認できました。よく整理できています。<br>時間をおいてもう一度受けると、選択肢の順番が変わった状態で確かめられます。</div>';
  }
  const okLine=(weakCs.length&&okCs.length)?`<div class="oktag">✓ 今回すべて正解だった講座：${okCs.map(c=>'講座'+c).join('・')}（この範囲はいまの理解でだいじょうぶそうです）</div>`:'';
  app.innerHTML=`
  <div class="card">
    <div class="sec-title">まずは、ここを見直しましょう</div>
    <div class="sec-lead">大事なのは点数ではなく「どこに戻るか」。まちがえた問題があった講座ごとに、見直すとよい章と、その問題の解説をまとめました。</div>
    ${review}
    ${okLine}
  </div>
  <div class="card">
    <div class="sec-title">記述問題の見直し</div>
    <div class="sec-lead">記述問題は、自分で見直す形です。次の観点で、書いた文章を読み返してみてください。</div>
    ${essayText.trim()?`<div class="mine">${esc(essayText)}</div>`:''}
    <ul class="pt">${ESSAY.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
    <div class="goto">戻るならこの講座：${esc(ESSAY.back)}</div>
  </div>
  <div class="card" style="text-align:center">
    <div class="scoreline">今回の答え合わせ：<b>${correct}</b> / ${QS.length}問</div>
    <div class="note" style="text-align:left;margin-top:10px">${esc(NOTE)}</div>
    <button class="btn" onclick="renderIntro()" style="margin-top:4px">もう一度受ける（選択肢の順番が変わります）</button>
    <p style="margin-top:14px;font-size:14px"><a href="../b-map/" style="color:var(--blue-dark);font-weight:600">🗺 試験準備の地図にもどる</a></p>
  </div>`;
  window.scrollTo(0,0);
}
</script>
</body>
</html>
